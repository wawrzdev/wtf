version: 2
project_name: wtf
before:
  hooks:
    - go test ./...
builds:
  - id: wtf
    main: .
    binary: wtf
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: -s -w -X main.version={{.Version}}
archives:
  - id: archives
    ids: [wtf]
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - docs/*
      - completions/*
nfpms:
  - id: native-packages
    ids: [wtf]
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    package_name: wtf
    vendor: wawrzdev
    homepage: https://github.com/wawrzdev/wtf
    maintainer: Kris Wawrzyniak <wawrz.dev@gmail.com>
    description: Local-first command discovery and composed documentation
    license: MIT
    formats: [deb, archlinux]
    archlinux:
      packager: Kris Wawrzyniak <wawrz.dev@gmail.com>
    bindir: /usr/bin
    dependencies:
      - fzf
    contents:
      - src: completions/wtf.bash
        dst: /etc/bash_completion.d/wawrzdev-wtf
      - src: completions/wtf.zsh
        dst: /usr/share/zsh/site-functions/_wtf
      - src: completions/wtf.fish
        dst: /usr/share/fish/vendor_completions.d/wtf.fish
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
release:
  # Upload and verify all nine assets before the workflow publishes the immutable release.
  draft: true
  target_commitish: "{{ .Commit }}"
  github:
    owner: wawrzdev
    name: wtf
